; AllQuad - one code base, several flight-controller targets
;   pio run -e esp32dev            ESP32 WROOM-32 DevKit
;   pio run -e esp32s3             ESP32-S3 DevKitC-1
;   pio run -e esp32c6             ESP32-C6 DevKitC-1 (single core, WiFi 6; OneShot125 / PWM motors)
;   pio run -e esp32p4             ESP32-P4 (no radio on chip: configurator over USB)
;   pio run -e blackpill_f411ce    STM32F411CEU6 Black Pill
;   pio run -e stm32f405           STM32F405RG flight controller (generic layout, src/hal/board.h)
;   pio run -e stm32f722           STM32F722RE flight controller (generic layout)
;   pio run -e stm32h743_weact     STM32H743VIT6 WeAct MiniSTM32H743 (480 MHz) + 4-in-1 AM32 ESC
;   pio run -e bridge_esp32c3      WiFi bridge for an STM32 FC (ESP32-C3, not a flight controller: src/bridge/)
; Upload: pio run -e <env> -t upload   ;   console / CLI: pio device monitor (ESP32 921600, others USB)
; PC simulator & tests: tools/build_host.sh && build/sim && build/tests

[platformio]
default_envs = esp32dev

; -fno-math-errno: sqrtf/fabsf compile to single FPU instructions (no errno side effects)
[common]
build_flags =
    -O2
    -Wall
    -Wno-missing-field-initializers
    -fno-math-errno
build_src_filter = +<*> -<sim/> -<os/os_host.cpp> -<bridge/>

; ---------------------------------------------------------------- ESP32
; pioarduino platform = Arduino-ESP32 core 3.x (new RMT / LEDC APIs)
; Size: the flight code is -O2, the rest of the firmware (web server, WiFi glue, CLI, MAVLink...)
; is built for size (-Os) through AQ_SIZE_OPT, and the Arduino core logs nothing (CORE_DEBUG_LEVEL 0).
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 921600   ; console / CLI / configurator (USB-UART bridge at 921600 baud)
board_build.partitions = partitions_allquad.csv
; bundles src/web/ui -> src/web/web_ui_data.h; signs WiFi updates when a key exists (tools/ota_sign.py)
extra_scripts =
    pre:tools/pio_embed_web.py
    post:tools/pio_ota_sign.py
build_src_filter = ${common.build_src_filter} -<hal/hal_stm32cube.cpp> -<hal/stm32/>
; lib/ holds the STM32Cube stack: never let the dependency finder pick its FreeRTOS / FatFs headers here
lib_ignore = aq_cmsis_core, aq_cube_f4, aq_cube_f7, aq_cube_h7, aq_freertos, aq_usb_device, aq_fatfs
; setup(), the peripheral drivers it starts (UART / USB / I2C / SPI / RMT interrupts, scheduler timer)
; and the Arduino WiFi event task all run on core 0: core 1 is left to the 1-2 kHz flight loop
build_flags = ${common.build_flags} -DCORE_DEBUG_LEVEL=0 -DAQ_SIZE_OPT -DARDUINO_RUNNING_CORE=0 -DARDUINO_EVENT_RUNNING_CORE=0

[env:esp32dev]
extends = esp32_base
board = esp32dev
board_build.f_cpu = 240000000L
build_flags = ${esp32_base.build_flags} -D BOARD_ESP32_DEVKIT

; WiFi bridge (src/bridge/bridge_main.cpp): ESP32-C3 SuperMini / DevKitM between a phone and an FC UART
; set to the "Configurator" function. Serves the configurator page; no flight code in it.
[env:bridge_esp32c3]
platform = ${esp32_base.platform}
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
extra_scripts = pre:tools/pio_embed_web.py
build_src_filter = -<*> +<bridge/>
lib_ignore = ${esp32_base.lib_ignore}
build_flags = -O2 -Wall -DAQ_BRIDGE -DCORE_DEBUG_LEVEL=0 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.partitions = partitions_allquad_8mb.csv
build_flags = ${esp32_base.build_flags} -D BOARD_ESP32S3_DEVKIT -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM; most "ESP32-S3 N16R8" DevKit clones):
; flash in QIO, PSRAM in OPI mode, 16 MB partitions (2 x 3 MB firmware + 9.9 MB blackbox).
; GPIO 33-37 belong to the octal PSRAM on these modules (the pin map keeps clear of them).
[env:esp32s3_n16r8]
extends = esp32_base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_allquad_16mb.csv
; pin map: BOARD_ESP32S3_N16R8 in src/hal/board.h (ICM-45686, CRSF RP4TD, GPS, props-out quad);
; battery divider 3.3k / 1k -> vbat_scale 4.3
build_flags = ${esp32_base.build_flags} -D BOARD_ESP32S3_N16R8 -D BOARD_HAS_PSRAM -D ARDUINO_USB_CDC_ON_BOOT=1
              -D AQ_DEFAULT_VBAT_SCALE=4.3f -D AQ_DEFAULT_YAW_REVERSED=1 -D AQ_DEFAULT_MOTOR_OUT=3241

[env:esp32c6]
extends = esp32_base
board = esp32-c6-devkitc-1
board_build.partitions = partitions_allquad_8mb.csv   ; DevKitC-1 N8: 8 MB flash
build_flags = ${esp32_base.build_flags} -D BOARD_ESP32C6_DEVKIT -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32p4]
extends = esp32_base
board = esp32-p4
board_build.partitions = partitions_allquad_8mb.csv
build_flags = ${esp32_base.build_flags} -D BOARD_ESP32P4 -D ARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------- STM32
; STM32Cube: ST HAL drivers + CMSIS + FreeRTOS kernel + ST USB device library + FatFs, vendored in lib/
; (no Arduino core, no downloads). main(), clocks and the time base: src/hal/stm32/system_stm32.cpp;
; peripherals: src/hal/hal_stm32cube.cpp; per-board peripheral routing: src/hal/stm32/board_stm32.h.
[stm32_base]
platform = https://github.com/platformio/platform-ststm32.git
upload_protocol = dfu
monitor_speed = 115200
extra_scripts = pre:tools/pio_stm32cube.py
; the bare-metal default toolchain (GCC 7) is too old for C++17: same GCC 14 as the former Arduino build
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.120301.0
lib_ldf_mode = off
build_src_filter = ${common.build_src_filter} -<hal/hal_esp32.cpp> -<hal/hal_arduino_common.cpp> -<web/web_esp32.cpp>
build_flags = ${common.build_flags}
    -D AQ_STM32
    -D USE_HAL_DRIVER
    -Wno-unused-parameter
    -I src/hal/stm32/conf
    -I lib/aq_cmsis_core/include
    -I lib/aq_freertos/include
    -I lib/aq_usb_device/include

[stm32f4_base]
extends = stm32_base
lib_deps = aq_cmsis_core, aq_cube_f4, aq_freertos, aq_usb_device
build_flags = ${stm32_base.build_flags} -D STM32F4xx -I lib/aq_cube_f4/include

[env:blackpill_f411ce]
extends = stm32f4_base
board = blackpill_f411ce
board_build.ldscript = ld/stm32f411.ld
build_flags = ${stm32f4_base.build_flags} -D STM32F411xE -D HSE_VALUE=25000000 -D BOARD_STM32F411_BLACKPILL

[env:stm32f405]
extends = stm32f4_base
board = genericSTM32F405RG
board_build.ldscript = ld/stm32f405.ld
build_flags = ${stm32f4_base.build_flags} -D STM32F405xx -D HSE_VALUE=8000000 -D BOARD_STM32F405

; QEMU (olimex-stm32-h405 machine) boot test of the F405 firmware: tools/qemu_f405.sh
[env:stm32f405_qemu]
extends = env:stm32f405
build_flags = ${env:stm32f405.build_flags} -D AQ_QEMU

[env:stm32f722]
extends = stm32_base
board = allquad_f722re
board_build.ldscript = ld/stm32f722.ld
lib_deps = aq_cmsis_core, aq_cube_f7, aq_freertos, aq_usb_device
build_flags = ${stm32_base.build_flags} -D STM32F7xx -D STM32F722xx -D HSE_VALUE=8000000 -I lib/aq_cube_f7/include
    -D BOARD_STM32F722

[stm32h743_base]
extends = stm32_base
board_build.ldscript = ld/stm32h743.ld
lib_deps = aq_cmsis_core, aq_cube_h7, aq_freertos, aq_usb_device, aq_fatfs
build_flags = ${stm32_base.build_flags} -D STM32H7xx -D STM32H743xx -D HSE_VALUE=25000000
    -I lib/aq_cube_h7/include -I lib/aq_fatfs/include
    -D AQ_DEFAULT_VBAT_SCALE=11.0f
    -D AQ_DEFAULT_DSHOT600=1
    -D AQ_LOOP_HZ_MAX=4000
    -D AQ_DEFAULT_LOOP_HZ=3200
    -D AQ_DEFAULT_SD_MODE=3

[env:stm32h743_weact]
; WeAct Studio MiniSTM32H743VITX. Upload over USB: hold BOOT0, tap RESET (ROM DFU), then
; pio run -e stm32h743_weact -t upload   (or the configurator's flasher)
extends = stm32h743_base
board = weact_mini_h743vitx
build_flags = ${stm32h743_base.build_flags} -D BOARD_STM32H743_WEACT

[env:stm32h743_devebox]
; MCUDev DevEBox STM32H7XX_M V2.0 (STM32H743VIT6). Same pins as the WeAct env (see src/hal/board.h);
; the board's LED D2 (PA1) follows motor 2, key K1 (PE3) is left alone. Upload: hold BOOT0 (B1), tap RST.
extends = stm32h743_base
board = devebox_h743vitx
build_flags = ${stm32h743_base.build_flags} -D BOARD_STM32H743_DEVEBOX
