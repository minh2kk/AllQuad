# AllQuad CI: every push / pull request runs the host tests, the simulator, the log analyser and
# builds the firmware for all boards, boots the STM32 (STM32Cube) firmware in QEMU and runs the configurator
# UI tests (Playwright) on the WebAssembly demo drone. Firmware files are kept as artifacts for 14 days.
# The robustness job fuzzes the protocol parsers (ASan + UBSan), runs cppcheck and a randomized soak
# (every run a new seed); the nightly schedule runs a long fuzz + soak.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Python packages
        run: pip install pymavlink cryptography
      - name: Board pin maps (no pin used twice, UART pins / alternate functions)
        run: python3 tools/check_pins.py
      - name: Unit tests (sanitizers)
        run: |
          bash tools/build_host.sh -fsanitize=address,undefined
          ./build/tests
      - name: Unit tests, MAVLink, simulator
        run: |
          bash tools/build_host.sh
          ./build/tests
          python3 tools/test_mavlink.py
          python3 tools/test_ota_sign.py
          ./build/sim all
      - name: Web page + log analyser
        run: |
          npm install --no-audit --no-fund
          python3 tools/embed_web.py
          node test/web/test_analysis.js
  robustness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Static analysis (cppcheck, reviewed suppressions in tools/cppcheck.supp)
        run: sh tools/static_check.sh
      - name: Fuzz protocol parsers (RX, MSP, MAVLink, GPS, sensors, AqLink, CLI, 4-way, config)
        run: |
          N=200000; [ "${{ github.event_name }}" = schedule ] && N=3000000
          sh tools/fuzz.sh $N ${{ github.run_number }}
      - name: Soak (random flights with sensor faults, radio loss, wind)
        run: |
          bash tools/build_host.sh
          N=24; [ "${{ github.event_name }}" = schedule ] && N=300
          ./build/sim soak $N ${{ github.run_number }} | tee soak.txt
          { echo "### Soak: seed ${{ github.run_number }}"; echo; grep -E "FAIL|soak flights failed" soak.txt; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q "FAIL" soak.txt
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: wasi-sdk (demo drone as WebAssembly)
        run: |
          curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz | tar xz -C /tmp
          WASI_SDK=/tmp/wasi-sdk-25.0-x86_64-linux sh tools/build_wasm.sh
      - name: Page bundle + Playwright
        run: |
          npm install --no-audit --no-fund
          pip install playwright zopfli
          python3 -m playwright install --with-deps chromium
          python3 tools/embed_web.py
          node test/web/test_wasm.js
      - name: Configurator UI tests
        run: |
          bash tools/build_host.sh && node test/web/test_analysis.js >/dev/null   # simulator logs (build/web/normal.bin) for the blackbox tests
          for t in test_ui test_configurator test_tools test_pro test_extras test_pwa test_ux test_guide test_flasher; do
            echo "== $t"; python3 test/web/$t.py /tmp/shots || exit 1
          done
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32s3, esp32s3_n16r8, esp32c6, esp32p4, blackpill_f411ce, stm32f405, stm32f722, stm32h743_weact, stm32h743_devebox, bridge_esp32c3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: PlatformIO
        run: pip install platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.*
          retention-days: 14
  qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-stm32f405_qemu-${{ hashFiles('platformio.ini') }}
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-arm
          pip install platformio
      - name: STM32F405 boot test (CLI answers in QEMU) + stack free per task
        run: |
          pio run -e stm32f405_qemu
          sh tools/qemu_f405.sh